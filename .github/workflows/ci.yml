name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel > build.log 2>&1
          rc=$?
          # Surface the build log as annotations so failures are readable from the API.
          tail -60 build.log | sed 's/^/::error title=build::/'
          exit $rc
      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure
