name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        steamvr: [ON, OFF]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVRE_ENABLE_STEAMVR=${{ matrix.steamvr }}
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel > build.log 2>&1
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Compiler and linker lines, as annotations (readable via the checks API).
          grep -E "error|LNK[0-9]+|fatal" build.log | grep -v "hmderrors" | head -40 | while IFS= read -r line; do
            echo "::error title=compile::${line}"
          done
          echo "::error title=build-log-size::$(wc -l < build.log) lines"
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
